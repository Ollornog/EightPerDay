name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # Never cancel on main: every state there needs its own result.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  klassifizieren:
    # Docs fast lane (repokit 0.52.0): text-only PR → the heavy job(s) below skip (a skipped job is a green check). The
    # decision lives only in scripts/_nur_text.sh; a broken classifier leaves the output empty and the job runs.
    # Push, schedule and manual runs are never text-only (no PR merge commit), so they behave as before.
    name: Text oder Code
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      nur_text: ${{ steps.k.outputs.nur_text }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # The PR merge commit and its base: _nur_text.sh needs the first parent, no credentials to fetch it.
          fetch-depth: 2
      - name: Klassifizieren
        id: k
        run: |
          if grund="$(scripts/_nur_text.sh)"; then echo "nur_text=ja" >> "$GITHUB_OUTPUT"; fi
          echo "$grund"

  check:
    name: Tests and hygiene
    runs-on: ubuntu-latest   # public repository, so never self-hosted (fork pull requests)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # No module cache: a check that loads from the Actions cache can inherit poisoned modules.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      # The database tests start a throwaway PostgreSQL from the server binaries of the runner image. Without them the
      # tests fail rather than skip; this step names the cause first.
      - name: Prove that nothing gets skipped silently
        run: |
          set -e
          go version
          python3 --version
          ls /usr/lib/postgresql/*/bin/initdb
          google-chrome --version
      - name: check.sh
        run: scripts/check.sh
      # A test that fails on the second run is broken. Proven here, not claimed.
      - name: Second run, repeatability
        run: scripts/check.sh

  image:
    needs: klassifizieren
    if: ${{ !cancelled() && needs.klassifizieren.outputs.nur_text != 'ja' }}
    name: Container image
    runs-on: ubuntu-latest   # public repository, so never self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Built and started hardened next to the database image of compose.yaml; nothing is published.
      - name: Check the image
        run: scripts/check-image.sh
