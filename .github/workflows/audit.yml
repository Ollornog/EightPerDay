name: audit

# Vulnerability gate. govulncheck checks modules AND the standard library of the Go version used to build, and fails
# only on reachable issues. Also nightly, because advisories appear without a code change. The tool comes from its
# own module .github/audit (pinned, checksums in go.sum).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # GitHub cron is UTC only: 02:50 UTC = 04:50 Europe/Berlin (summer) or 03:50 (winter).
    - cron: "50 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  klassifizieren:
    # Docs fast lane (repokit 0.52.0): text-only PR → the heavy job(s) below skip (a skipped job is a green check). The
    # decision lives only in scripts/_nur_text.sh; a broken classifier leaves the output empty and the job runs.
    # Push, schedule and manual runs are never text-only (no PR merge commit), so they behave as before.
    name: Text oder Code
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      nur_text: ${{ steps.k.outputs.nur_text }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # The PR merge commit and its base: _nur_text.sh needs the first parent, no credentials to fetch it.
          fetch-depth: 2
      - name: Klassifizieren
        id: k
        run: |
          if grund="$(scripts/_nur_text.sh)"; then echo "nur_text=ja" >> "$GITHUB_OUTPUT"; fi
          echo "$grund"

  audit:
    needs: klassifizieren
    if: ${{ !cancelled() && needs.klassifizieren.outputs.nur_text != 'ja' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      # Zero packages would be a green run without findings: no evidence, but an error.
      - name: Anything to check?
        run: |
          n="$(go list ./... | wc -l)"
          echo "Packages: $n"
          [ "$n" -gt 0 ] || { echo "::error::no packages found, the run checked nothing"; exit 1; }
      - name: govulncheck
        run: go -C .github/audit tool govulncheck -C "$GITHUB_WORKSPACE" -show verbose ./...
